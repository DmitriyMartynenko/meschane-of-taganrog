name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: ${{ vars.DATABASE_URL }}

jobs:
  main:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma Setup
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy

      - name: Type Generation & Check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Static Code Analysis
        run: |
          npx eslint .
          npx prettier --check .
          npx steiger ./src --fail-on-warnings

      - name: Notify Vercel
        uses: 'vercel/repository-dispatch/actions/status@v1'
        if: always()
        with:
          name: 'Vercel - CI Pipeline / main'
          github_token: ${{ secrets.GITHUB_TOKEN }}
