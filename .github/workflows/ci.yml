name: Continuous Integration

on:
  workflow_call:

jobs:
  code-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma Setup
        run: |
          npx prisma validate
          npx prisma generate

      - name: Type Generation & Check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Static Code Analysis
        run: |
          npx eslint .
          npx prettier --check .
          npx steiger ./src --fail-on-warnings
