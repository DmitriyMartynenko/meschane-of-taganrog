services:
  postgres:
    image: postgres:latest
    container_name: postgres-container
    environment:
      - POSTGRES_USER=meshchane_user
      - POSTGRES_PASSWORD=meshchane_password
      - POSTGRES_DB=meshchane_db
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
